# Portfolio `home` — service de l'export statique Astro.
#
# Les en-tetes de securite (HSTS, nosniff, frameDeny, Referrer-Policy,
# Permissions-Policy) viennent du middleware socle-securite de Traefik, et la
# Content-Security-Policy des labels du service (containers/web.yml).
#
# Raison de ne PAS poser la CSP ici : en nginx, `add_header` n'est pas
# cumulatif entre niveaux. Un seul `add_header` dans un `location` annule
# TOUS ceux herites du bloc `server`. Comme chaque `location` ci-dessous pose
# son propre Cache-Control, une CSP declaree au niveau `server` disparaitrait
# de toutes les reponses — sans le moindre message.
server {
    listen      80 default_server;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    location = /_nginx-sante {
        access_log off;
        # `default_type` et non `add_header Content-Type` : `return 200` emet
        # deja un Content-Type, et add_header en ajouterait un SECOND.
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # -----------------------------------------------------------------------
    # Resolution des routes
    #
    # `=404` et non `/index.html` : l'export Astro produit un fichier HTML par
    # route, donc chaque page existe reellement. Un repli sur l'accueil
    # transformerait toute URL inexistante en 200 affichant la page d'accueil
    # — un faux 404. Les moteurs indexeraient des pages fantomes, et un lien
    # casse cesserait d'etre visible : la page « marche », elle affiche
    # simplement autre chose.
    #
    # `$uri/index.html` AVANT `$uri/` : servir un repertoire declenche la
    # redirection automatique de nginx vers l'URL avec barre oblique finale.
    # C'est un 301 PERMANENT, donc mis en cache indefiniment par les
    # navigateurs — le corriger plus tard ne suffit pas pour les visiteurs
    # deja venus.
    # -----------------------------------------------------------------------
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;

        # `no-store` est pose ICI, pas seulement sur `\.html$`. Une regle
        # `location ~* \.html$` s'applique a l'URI DEMANDEE, pas au fichier
        # finalement servi : `/a-propos.html` la declencherait, mais
        # `/a-propos` y echapperait et ne recevrait AUCUN en-tete de cache.
        # Le navigateur applique alors sa propre heuristique et peut conserver
        # la page longtemps : un deploiement reste invisible pour un visiteur
        # deja venu.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /404.html {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # -----------------------------------------------------------------------
    # Actifs a nom empreinte : jamais revalides
    #
    # Astro place ses actifs construits dans /_astro/ avec une empreinte du
    # contenu dans le nom. L'URL est donc immuable par construction.
    # -----------------------------------------------------------------------
    location /_astro/ {
        # Un SEUL en-tete Cache-Control, explicite. `expires 1y` emettrait son
        # propre "Cache-Control: max-age=..." EN PLUS de celui-ci : deux
        # en-tetes concurrents, que les navigateurs fusionnent mais qu'un CDN
        # peut interpreter differemment.
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Actifs SANS empreinte (favicon, images deposees dans public/) : le nom ne
    # change pas quand le contenu change. Une duree longue servirait l'ancienne
    # version apres un deploiement.
    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # index.html : JAMAIS mis en cache
    #
    # C'est lui qui reference les actifs empreintes. Un index.html en cache
    # continue de pointer vers les fichiers de la version precedente, qui
    # n'existent plus : page blanche apres deploiement, qui se « repare »
    # toute seule des que le cache expire.
    #
    # `location /` couvre deja la forme sans extension ; ces deux blocs
    # couvrent la forme explicite (lien partage, robot d'indexation).
    # -----------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
