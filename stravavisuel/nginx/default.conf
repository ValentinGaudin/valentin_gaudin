# Strava Visuel — service de l'export statique Expo.
#
# Les en-tetes de securite viennent du middleware socle-securite de Traefik, et
# la Content-Security-Policy des labels du service (containers/web.yml).
#
# Raison de ne PAS poser la CSP ici : en nginx, `add_header` n'est pas
# cumulatif entre niveaux. Un seul `add_header` dans un `location` annule TOUS
# ceux herites du bloc `server` — la CSP disparaitrait de chaque reponse
# portant un Cache-Control, sans le moindre message.
server {
    listen      80 default_server;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    location = /_nginx-sante {
        access_log off;
        default_type text/plain;
        return 200 "nginx ok\n";
    }

    # -----------------------------------------------------------------------
    # `_sitemap` : page de developpement d'Expo Router
    #
    # Elle liste toutes les routes de l'application. Sans utilite en
    # production, et elle expose la structure du routage : on la refuse
    # plutot que de la servir.
    # -----------------------------------------------------------------------
    location = /_sitemap {
        return 404;
    }

    location = /_sitemap.html {
        return 404;
    }

    # -----------------------------------------------------------------------
    # Resolution des routes
    #
    # `expo export -p web` avec output "static" produit un fichier HTML par
    # route. `$uri.html` sert donc /route depuis route.html — sans lui, une
    # visite directe (lien partage, rafraichissement, robot) retomberait sur
    # index.html : le site SEMBLE marcher, le routeur client rattrape, mais le
    # HTML pre-rendu n'est jamais servi et le referencement disparait.
    #
    # `=404` et non `/index.html` : chaque route ayant son fichier, un repli
    # sur l'accueil transformerait toute URL inexistante en 200 affichant la
    # page d'accueil — un faux 404 que rien ne signale.
    # -----------------------------------------------------------------------
    error_page 404 "/+not-found.html";

    location / {
        try_files $uri $uri.html $uri/index.html $uri/ =404;

        # `no-store` pose ICI, pas seulement sur `\.html$` : une regle
        # `location ~* \.html$` porte sur l'URI DEMANDEE, pas sur le fichier
        # servi. La forme sans extension y echapperait et ne recevrait aucun
        # en-tete de cache.
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = "/+not-found.html" {
        internal;
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # -----------------------------------------------------------------------
    # Actifs a nom empreinte : jamais revalides
    #
    # Expo place le bundle dans /_expo/static/ avec une empreinte du contenu
    # dans le nom, et les images dans /assets/ de meme.
    # -----------------------------------------------------------------------
    location /_expo/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # index.html : JAMAIS mis en cache
    #
    # C'est lui qui reference le bundle empreinte. Un index.html en cache
    # continue de pointer vers un fichier qui n'existe plus : page blanche
    # apres deploiement, qui se repare seule quand le cache expire.
    # -----------------------------------------------------------------------
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~* \.html$ {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }
}
