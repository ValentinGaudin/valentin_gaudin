# nginx de Strava Visuel.
#
# Repris de la brique web-static du socle. La compression est laissee a
# Traefik (middleware socle-compression) : la faire deux fois gaspille du CPU
# sans gagner un octet.
user  nginx;
worker_processes  auto;
error_log  stderr warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  principal  '$remote_addr - [$time_local] "$request" $status '
                           '$body_bytes_sent "$http_referer" "$http_user_agent" '
                           'rt=$request_time';
    access_log  /dev/stdout principal;

    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    server_tokens off;
    keepalive_timeout 65;

    gzip off;

    # Sans ceci, les journaux n'enregistrent que l'IP de Traefik. Les plages
    # sont celles des reseaux Docker.
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  10.0.0.0/8;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    include /etc/nginx/conf.d/*.conf;
}
